{{if .Error}}
<div class="alert alert-error text-sm">
  <span>error: {{.Error}}</span>
</div>
{{else}}
<div class="bg-base-100 border border-base-content/10 rounded-lg p-4">
  <span class="text-success font-semibold text-sm">generated {{.Count}} dashboards</span>
  <div class="mt-2 space-y-1">
    {{range .Results}}
    <div class="flex items-center gap-2 text-sm">
      <span class="text-success">&#10003;</span>
      <span class="font-semibold">{{.Name}}</span>: {{.Panels}} panels
      {{if gt (len .Formats) 0}}
      <span class="text-base-content/50">&middot;</span>
      {{range $i, $fmt := .Formats}}
        {{if $i}}, {{end}}
        <span class="badge badge-xs badge-outline">{{$fmt}}</span>
      {{end}}
      {{end}}
      {{if gt .Size 0}}
      <span class="text-base-content/50">&middot; {{.Size}} bytes</span>
      {{end}}
    </div>
    {{end}}
  </div>
</div>
{{end}}
