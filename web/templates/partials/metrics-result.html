{{if .Error}}
<div class="alert alert-error text-sm">
  <span>error: {{.Error}}</span>
</div>
{{else if not .Metrics}}
<div class="text-center py-12 text-base-content/50">
  <p>no metrics found matching filter</p>
</div>
{{else}}
<div class="card bg-base-100 border border-base-content/10">
  <div class="card-body p-5">
    <div class="flex justify-between items-center mb-3">
      <h3 class="card-title text-sm">{{.Total}} metrics</h3>
      <span class="text-xs text-base-content/50">from {{.Datasource}}{{if .Job}} &middot; job: {{.Job}}{{end}}</span>
    </div>
    <form hx-post="/api/metrics/snippet" hx-target="#snippet-result">
      <input type="hidden" name="datasource" value="{{.Datasource}}">
      <div class="space-y-1 max-h-[600px] overflow-y-auto" id="metrics-list">
        {{range .Metrics}}
        <label class="flex items-center gap-3 p-2 rounded hover:bg-base-200 cursor-pointer metric-item" data-metric-name="{{.Name}}">
          <input type="checkbox" name="metrics" value="{{.Name}}" data-type="{{.Type}}" data-help="{{.Help}}" class="checkbox checkbox-xs checkbox-primary metric-checkbox">
          <div class="flex-1 min-w-0">
            <div class="font-mono text-sm truncate">{{.Name}}</div>
            {{if .Help}}<div class="text-xs text-base-content/40 truncate">{{.Help}}</div>{{end}}
          </div>
          <span class="badge badge-sm badge-outline">{{.Type}}</span>
          {{if $.AIEnabled}}
          <!-- AI suggest button for single metric -->
          <button type="button"
                  class="btn btn-xs btn-ghost btn-circle text-warning"
                  title="AI: suggest panel for this metric"
                  onclick="suggestSingleMetric('{{.Name}}', '{{.Type}}', '{{.Help}}');event.preventDefault()"
                  data-metric="{{.Name}}"
                  data-type="{{.Type}}"
                  data-help="{{.Help}}">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
          </button>
          {{end}}
        </label>
        {{end}}
      </div>
      <div class="flex gap-2 mt-3 flex-wrap">
        <button type="submit" class="btn btn-sm btn-primary">generate YAML snippet</button>
        {{if .AIEnabled}}
        <button type="button" class="btn btn-sm btn-secondary gap-1"
                onclick="generateBulkAISuggestion()"
                id="bulk-ai-btn">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
          AI generate section (<span id="selected-count">0</span> selected)
        </button>
        {{end}}
      </div>
    </form>
    <div id="snippet-result" class="mt-3"></div>
  </div>
</div>
{{end}}
